<meta name="theme-color" content="#d64545">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-dim: #6b7280;
    --accent: #d64545;
    --caught-bg: #e6f7ec;
    --caught-border: #34a853;
    --border: #e2e4e8;
    --header-bg: #d64545;
    --header-text: #ffffff;
    --chip-bg: #eef0f3;
    --radius: 12px;
    --gap: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card-bg: #23262c;
      --text: #f0f1f3;
      --text-dim: #9aa0a8;
      --accent: #ff6b6b;
      --caught-bg: #123421;
      --caught-border: #34a853;
      --border: #33363d;
      --header-bg: #7a1f1f;
      --header-text: #ffffff;
      --chip-bg: #2c2f36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .header-titles h1 {
    margin: 0;
    font-size: 1.2rem;
    line-height: 1.25;
  }
  .header-titles .sub {
    font-size: 0.78rem;
    opacity: 0.9;
    margin-top: 2px;
  }
  .game-switch-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.75rem;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .game-switch-btn:active { background: rgba(255,255,255,0.3); }

  .game-menu {
    display: none;
    margin-top: 10px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 6px;
  }
  .game-menu.open { display: block; }
  .game-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #fff;
    padding: 9px 10px;
    font-size: 0.85rem;
    border-radius: 7px;
    cursor: pointer;
  }
  .game-menu button.active {
    background: rgba(255,255,255,0.25);
    font-weight: 600;
  }
  .game-menu button:active { background: rgba(255,255,255,0.2); }

  .progress-wrap {
    margin-top: 12px;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #ffffff;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.72rem;
    margin-top: 5px;
    text-align: right;
    opacity: 0.9;
  }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.7rem;
    color: var(--text-dim);
    padding: 10px 16px 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .legend .dot.sword { background: #4a6fa5; }
  .legend .dot.shield { background: #a54a4a; }
  .legend .dot.split { background: #8a6dbb; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    gap: 8px;
    padding: 10px 16px 14px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 9;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  .controls input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toggle-btn {
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-btn:active { background: var(--chip-bg); }

  /* ---------- Sections ---------- */
  main {
    padding: 4px 12px 0;
  }
  .section {
    margin-top: 16px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 4px 10px 12px;
    border: 1px solid var(--border);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    cursor: pointer;
    user-select: none;
  }
  .section-header h2 {
    font-size: 1rem;
    margin: 0;
  }

    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header .count {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .section-header .chevron {
    transition: transform 0.2s ease;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
    gap: 8px;
    padding-top: 6px;
  }
  .section.collapsed .grid { display: none; }
  .card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 6px 4px 8px;
    display: flex;

    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;

    background: var(--caught-bg);
    border-color: var(--caught-border);
  }
  .card.hidden { display: none; }
  .card img {

    height: 54px;

    filter: grayscale(1);
    opacity: 0.5;
  }
  .card.caught img { filter: none; opacity: 1; }
  .card .name {
    font-size: 0.66rem;
    margin-top: 3px;
    line-height: 1.15;
    word-break: break-word;
  }
  .card .num {
    font-size: 0.58rem;
    color: var(--text-dim);
    position: absolute;
    top: 3px;
    left: 5px;
  }
  .card .check {
    position: absolute;
    top: 3px;
    right: 5px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    background: transparent;
  }
  .card.caught .check {
    background: var(--caught-border);
    border-color: var(--caught-border);
  }
  .badge {
    position: absolute;
    bottom: 3px;
    left: 3px;
    font-size: 0.52rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 4px;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .badge.sword { background: #4a6fa5; }
  .badge.shield { background: #a54a4a; }
  .badge.split { background: #8a6dbb; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 22px 16px 8px;
    line-height: 1.6;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 0.75rem;
    margin-top: 8px;
    cursor: pointer;
  }
</style>

// ---------- Storage: load, migrate, save ----------
function loadStore() {
  let store = null;
  try {
    store = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  } catch (e) { store = null; }

  if (!store) {
    store = { schemaVersion: 2, currentGame: "sword-shield", games: {} };
    // Migrate legacy Sword & Shield-only save into the new multi-game format.
    try {
      const legacy = JSON.parse(localStorage.getItem(OLD_SWSH_KEY) || "null");
      if (legacy && typeof legacy === "object") {
        store.games["sword-shield"] = { caught: legacy };
        store.migratedFromV1 = true;
      }
    } catch (e) { /* no legacy data, ignore */ }
    saveStore(store);
  }
  if (!store.games) store.games = {};
  if (!store.currentGame || !GAMES[store.currentGame]) store.currentGame = Object.keys(GAMES)[0];
  return store;
}

function saveStore(store) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  } catch (e) { /* storage unavailable, ignore */ }
}

let store = loadStore();

function currentGameId() { return store.currentGame; }
function currentGame() { return GAMES[currentGameId()]; }
function currentCaughtMap() {
  const gid = currentGameId();
  if (!store.games[gid]) store.games[gid] = { caught: {} };
  if (!store.games[gid].caught) store.games[gid].caught = {};
  return store.games[gid].caught;
}

function isCaught(slug) {
  return !!currentCaughtMap()[slug];
}

function toggleCaught(slug) {
  const map = currentCaughtMap();
  if (map[slug]) delete map[slug]; else map[slug] = true;
  saveStore(store);
  updateCardEls(slug);
  updateProgress();
  applyFilters();
}

function updateCardEls(slug) {
  document.querySelectorAll('.card[data-slug="' + slug + '"]').forEach(function(el) {
    el.classList.toggle('caught', isCaught(slug));
  });
}

// ---------- View state (search + all/caught/uncaught toggle) ----------
const VIEW_MODES = ["all", "uncaught"];
const VIEW_LABELS = { all: "All", uncaught: "Not caught" };
let viewMode = "all";

function totalUniqueSlugs(game) {
  const all = new Set();
  game.sections.forEach(function(s) { s.slugs.forEach(function(slug) { all.add(slug); }); });
  return all;
}

function updateProgress() {
  const game = currentGame();
  const all = totalUniqueSlugs(game);
  let caught = 0;
  all.forEach(function(slug) { if (isCaught(slug)) caught++; });
  const total = all.size;
  const pct = total ? Math.round((caught / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = caught + ' / ' + total + ' caught (' + pct + '%)';

  game.sections.forEach(function(s) {
    let c = 0;
    s.slugs.forEach(function(slug) { if (isCaught(slug)) c++; });
    const el = document.getElementById('count-' + s.id);
    if (el) el.textContent = c + ' / ' + s.slugs.length;
  });
}

function buildSection(game, section) {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.id = 'section-' + section.id;

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML =
    '<h2>' + section.label + '</h2>' +
    '<div class="meta">' +
      '<span class="count" id="count-' + section.id + '">0 / ' + section.slugs.length + '</span>' +
      '<span class="chevron">&#9662;</span>' +
    '</div>';
  header.addEventListener('click', function() { wrap.classList.toggle('collapsed'); });
  wrap.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'grid';

  section.slugs.forEach(function(slug, idx) {
    const sp = game.species[slug];
    if (!sp) return;
    const displayNum = sp.num ? sp.num : (idx + 1);
    const card = document.createElement('div');
    card.className = 'card' + (isCaught(slug) ? ' caught' : '');
    card.dataset.slug = slug;
    card.dataset.name = sp.n.toLowerCase();
    let badgeHtml = '';
    if (sp.v === 'sword') badgeHtml = '<span class="badge sword">SW</span>';
    else if (sp.v === 'shield') badgeHtml = '<span class="badge shield">SH</span>';
    else if (sp.v === 'split') badgeHtml = '<span class="badge split">SW/SH</span>';
    card.innerHTML =
      '<span class="num">#' + String(displayNum).padStart(3, '0') + '</span>' +
      '<span class="check"></span>' +
      '<img src="' + sp.i + '" alt="' + sp.n + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="name">' + sp.n + '</div>' +
      badgeHtml;
    card.addEventListener('click', function() { toggleCaught(slug); });
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

function hasVersionBadges(game) {
  for (const slug in game.species) {
    if (game.species[slug].v) return true;
  }
  return false;
}

function render() {
  const game = currentGame();
  document.getElementById('gameTitle').textContent = game.label;
  const totalCount = totalUniqueSlugs(game).size;
  document.getElementById('gameSub').textContent = totalCount + ' Pokémon to track';
  document.getElementById('legendRow').style.display = hasVersionBadges(game) ? 'flex' : 'none';

  const main = document.getElementById('main');
  main.innerHTML = '';
  game.sections.forEach(function(section) { main.appendChild(buildSection(game, section)); });
  updateProgress();
  applyFilters();
  renderGameMenu();
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(function(card) {
    const matchesText = !q || card.dataset.name.indexOf(q) !== -1;
    const caught = card.classList.contains('caught');
    let matchesMode = true;
    if (viewMode === 'caught') matchesMode = caught;
    if (viewMode === 'uncaught') matchesMode = !caught;
    card.classList.toggle('hidden', !(matchesText && matchesMode));
  });
}

// ---------- Game switcher ----------
function renderGameMenu() {
  const menu = document.getElementById('gameMenu');
  menu.innerHTML = '';
  Object.keys(GAMES).forEach(function(gid) {
    const btn = document.createElement('button');
    btn.textContent = GAMES[gid].shortLabel || GAMES[gid].label;
    if (gid === currentGameId()) btn.className = 'active';
    btn.addEventListener('click', function() {
      store.currentGame = gid;
      saveStore(store);
      menu.classList.remove('open');
      render();
    });
    menu.appendChild(btn);
  });
}

document.getElementById('gameSwitchBtn').addEventListener('click', function() {
  document.getElementById('gameMenu').classList.toggle('open');
});

document.getElementById('searchBox').addEventListener('input', applyFilters);

document.getElementById('viewToggleBtn').addEventListener('click', function() {
  const idx = VIEW_MODES.indexOf(viewMode);
  viewMode = VIEW_MODES[(idx + 1) % VIEW_MODES.length];
  this.textContent = VIEW_LABELS[viewMode];
  applyFilters();
});

document.getElementById('resetBtn').addEventListener('click', function() {
  const game = currentGame();
  if (confirm('Reset all catch progress for ' + game.label + '? This cannot be undone.')) {
    store.games[currentGameId()] = { caught: {} };
    saveStore(store);
    render();
  }
});

render();
</script>

</body>
</html>
