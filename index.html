<style>
  :root {
    --bg: #f2f4f8;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-dim: #6b7280;
    --accent: #2f8fc4;
    --joycon-red: #e23a4e;
    --joycon-blue: #42bae8;
    --caught-bg: #e5f8ee;
    --caught-border: #37b878;
    --border: #e2e4e8;
    --header-bg: #1a1d24;
    --header-text: #ffffff;
    --chip-bg: #eef0f3;
    --radius: 14px;
    --gap: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d24;
      --card-bg: #23262d;
      --text: #f0f1f3;
      --text-dim: #9aa0a8;
      --accent: #42bae8;
      --joycon-red: #e23a4e;
      --joycon-blue: #42bae8;
      --caught-bg: #123c25;
      --caught-border: #37b878;
      --border: #33363d;
      --header-bg: #121419;
      --header-text: #ffffff;
      --chip-bg: #2c2f36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--joycon-red), var(--joycon-blue)) 1;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .header-titles h1 {
    margin: 0;
    font-size: 1.2rem;
    line-height: 1.25;
  }
  .header-titles .sub {
    font-size: 0.78rem;
    opacity: 0.9;
    margin-top: 2px;
  }
  .header-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .game-switch-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.75rem;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .game-switch-btn:active { background: rgba(255,255,255,0.3); }

  .game-menu {
    display: none;
    margin-top: 10px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 6px;
  }
  .game-menu.open { display: block; }
  .game-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #fff;
    padding: 9px 10px;
    font-size: 0.85rem;
    border-radius: 7px;
    cursor: pointer;
  }
  .game-menu button.active {
    background: rgba(255,255,255,0.25);
    font-weight: 600;
  }
  .game-menu button:active { background: rgba(255,255,255,0.2); }

  .progress-wrap {
    margin-top: 12px;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #ffffff;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.72rem;
    margin-top: 5px;
    text-align: right;
    opacity: 0.9;
  }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.7rem;
    color: var(--text-dim);
    padding: 10px 16px 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    gap: 8px;
    padding: 10px 16px 14px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 9;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 9px 32px 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 16px;
    width: 100%;
  }
  .controls input[type="search"]::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
  }
  .controls input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
  }
  .search-clear {
    display: none;
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--chip-bg);
    color: var(--text-dim);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  .search-clear.visible { display: flex; }
  .search-clear:active { background: var(--border); }
  .toggle-btn {
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-btn:active { background: var(--chip-bg); }

  /* ---------- Sections ---------- */
  main {
    padding: 4px 12px 0;
  }
  .section {
    margin-top: 16px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 4px 10px 12px;
    border: 1px solid var(--border);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    cursor: pointer;
    user-select: none;
  }
  .section-header h2 {
    font-size: 1rem;
    margin: 0;
  }
  .section-header .meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header .count {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .section-header .chevron {
    transition: transform 0.2s ease;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
    gap: 8px;
    padding-top: 6px;
  }
  .section.collapsed .grid { display: none; }
  .card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 6px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }
  .card.caught {
    background: var(--caught-bg);
    border-color: var(--caught-border);
  }
  .card.hidden { display: none; }
  .card img {
    width: 54px;
    height: 54px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.5;
  }
  .card.caught img { filter: none; opacity: 1; }
  .card .name {
    font-size: 0.66rem;
    margin-top: 3px;
    line-height: 1.15;
    word-break: break-word;
  }
  .card .num {
    font-size: 0.58rem;
    color: var(--text-dim);
    position: absolute;
    top: 3px;
    left: 5px;
  }
  .card .check {
    position: absolute;
    top: 3px;
    right: 5px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    background: transparent;
  }
  .card.caught .check {
    background: var(--caught-border);
    border-color: var(--caught-border);
  }
  .badge {
    position: absolute;
    bottom: 3px;
    left: 3px;
    font-size: 0.52rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 4px;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--card-bg);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 78vh;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .modal-header h3 {
    margin: 0;
    font-size: 1rem;
  }
  .modal-close {
    background: var(--chip-bg);
    border: none;
    color: var(--text);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 1rem;
    cursor: pointer;
  }
  .chain-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .chain-member {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 6px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    width: 84px;
  }
  .chain-member.caught {
    background: var(--caught-bg);
    border-color: var(--caught-border);
  }
  .chain-member.current {
    border-color: var(--accent);
    border-width: 3px;
  }
  .chain-member img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.5;
  }
  .chain-member.caught img { filter: none; opacity: 1; }
  .chain-member .name {
    font-size: 0.64rem;
    margin-top: 3px;
    line-height: 1.15;
  }
  .chain-arrow {
    color: var(--text-dim);
    font-size: 1rem;
  }

  .detail-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 8px 0 20px;
  }
  .detail-main img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.5;
  }
  .detail-main img.caught {
    filter: none;
    opacity: 1;
  }
  .detail-toggle-btn {
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    background: var(--chip-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .detail-toggle-btn.caught {
    background: var(--caught-border);
    color: #fff;
  }
  .detail-toggle-btn:active { opacity: 0.85; }
  .detail-evo-section {
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .detail-evo-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 10px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-group-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 14px 0 6px;
  }
  .history-group-label:first-child { margin-top: 0; }
  .history-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
  }
  .history-row:active { background: var(--chip-bg); }
  .history-row img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .history-row .history-name {
    flex: 1;
    font-size: 0.88rem;
  }
  .history-row .history-time {
    font-size: 0.7rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .history-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 20px 0;
  }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 22px 16px 8px;
    line-height: 1.6;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 5px 12px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .footer-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
  }
  .detail-db-link {
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
  }
  .detail-db-link:active { opacity: 0.7; }
</style>

const STORAGE_KEY = "pokemon-tracker-v2";
const OLD_SWSH_KEY = "pokedex-sword-shield-v1"; // legacy single-game key

// ---------- Storage: load, migrate, save ----------
function loadStore() {
  let store = null;
  try {
    store = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  } catch (e) { store = null; }

  if (!store) {
    store = { schemaVersion: 2, currentGame: "sword-shield", games: {} };
    // Migrate legacy Sword & Shield-only save into the new multi-game format.
    try {
      const legacy = JSON.parse(localStorage.getItem(OLD_SWSH_KEY) || "null");
      if (legacy && typeof legacy === "object") {
        store.games["sword-shield"] = { caught: legacy };
        store.migratedFromV1 = true;
      }
    } catch (e) { /* no legacy data, ignore */ }
    saveStore(store);
  }
  if (!store.games) store.games = {};
  if (!store.currentGame || !GAMES[store.currentGame]) store.currentGame = Object.keys(GAMES)[0];
  return store;
}

function saveStore(store) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  } catch (e) { /* storage unavailable, ignore */ }
}

let store = loadStore();

function currentGameId() { return store.currentGame; }
function currentGame() { return GAMES[currentGameId()]; }
function currentCaughtMap() {
  const gid = currentGameId();
  if (!store.games[gid]) store.games[gid] = { caught: {} };
  if (!store.games[gid].caught) store.games[gid].caught = {};
  return store.games[gid].caught;
}

function isCaught(slug) {
  return !!currentCaughtMap()[slug];
}

function toggleCaught(slug) {
  const map = currentCaughtMap();
  if (map[slug]) delete map[slug]; else map[slug] = Date.now();
  saveStore(store);
  updateCardEls(slug);
  updateProgress();
  applyFilters();
}

function updateCardEls(slug) {
  document.querySelectorAll('.card[data-slug="' + slug + '"]').forEach(function(el) {
    el.classList.toggle('caught', isCaught(slug));
  });
}

// ---------- View state (search + all/caught/uncaught toggle) ----------
const VIEW_MODES = ["all", "uncaught"];
const VIEW_LABELS = { all: "All", uncaught: "Not caught" };
let viewMode = "all";

function totalUniqueSlugs(game) {
  const all = new Set();
  game.sections.forEach(function(s) { s.slugs.forEach(function(slug) { all.add(slug); }); });
  return all;
}

function updateProgress() {
  const game = currentGame();
  const all = totalUniqueSlugs(game);
  let caught = 0;
  all.forEach(function(slug) { if (isCaught(slug)) caught++; });
  const total = all.size;
  const pct = total ? Math.round((caught / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = caught + ' / ' + total + ' caught (' + pct + '%)';

  game.sections.forEach(function(s) {
    let c = 0;
    s.slugs.forEach(function(slug) { if (isCaught(slug)) c++; });
    const el = document.getElementById('count-' + s.id);
    if (el) el.textContent = c + ' / ' + s.slugs.length;
  });
}

function buildSection(game, section) {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.id = 'section-' + section.id;

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML =
    '<h2>' + section.label + '</h2>' +
    '<div class="meta">' +
      '<span class="count" id="count-' + section.id + '">0 / ' + section.slugs.length + '</span>' +
      '<span class="chevron">&#9662;</span>' +
    '</div>';
  header.addEventListener('click', function() { wrap.classList.toggle('collapsed'); });
  wrap.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'grid';

  section.slugs.forEach(function(slug, idx) {
    const sp = game.species[slug];
    if (!sp) return;
    const displayNum = sp.num ? sp.num : (idx + 1);
    const card = document.createElement('div');
    card.className = 'card' + (isCaught(slug) ? ' caught' : '');
    card.dataset.slug = slug;
    card.dataset.name = sp.n.toLowerCase();
    let badgeHtml = '';
    const vb = game.versionBadges && game.versionBadges[sp.v];
    if (vb) badgeHtml = '<span class="badge" style="background:' + vb.color + '">' + vb.short + '</span>';
    card.innerHTML =
      '<span class="num">#' + String(displayNum).padStart(3, '0') + '</span>' +
      '<span class="check"></span>' +
      '<img src="' + sp.i + '" alt="' + sp.n + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="name">' + sp.n + '</div>' +
      badgeHtml;
    card.addEventListener('click', function() { openDetailSheet(slug); });
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

let openSlug = null;

function renderDetailSheet() {
  if (!openSlug) return;
  const game = currentGame();
  const sp = game.species[openSlug];
  if (!sp) return;

  document.getElementById('detailName').textContent = sp.n;
  document.getElementById('detailImg').src = sp.i;
  document.getElementById('detailImg').alt = sp.n;
  document.getElementById('detailDbLink').href = 'https://pokemondb.net/pokedex/' + openSlug;
  document.getElementById('detailImg').className = isCaught(openSlug) ? 'caught' : '';

  const toggleBtn = document.getElementById('detailToggleBtn');
  const caught = isCaught(openSlug);
  toggleBtn.textContent = caught ? 'Caught ✓' : 'Mark as caught';
  toggleBtn.className = 'detail-toggle-btn' + (caught ? ' caught' : '');

  const evoSection = document.getElementById('detailEvoSection');
  const evoRow = document.getElementById('detailEvoRow');
  evoRow.innerHTML = '';
  const members = sp.c && game.chains ? game.chains[sp.c] : null;
  if (members && members.length > 1) {
    evoSection.style.display = '';
    members.forEach(function(slug, i) {
      const msp = game.species[slug];
      if (!msp) return;
      if (i > 0) {
        const arrow = document.createElement('span');
        arrow.className = 'chain-arrow';
        arrow.innerHTML = '&#8594;';
        evoRow.appendChild(arrow);
      }
      const el = document.createElement('div');
      el.className = 'chain-member' + (isCaught(slug) ? ' caught' : '') + (slug === openSlug ? ' current' : '');
      el.innerHTML =
        '<img src="' + msp.i + '" alt="' + msp.n + '" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="name">' + msp.n + '</div>';
      el.addEventListener('click', function() { openSlug = slug; renderDetailSheet(); });
      evoRow.appendChild(el);
    });
  } else {
    evoSection.style.display = 'none';
  }
}

function openDetailSheet(slug) {
  openSlug = slug;
  renderDetailSheet();
  document.getElementById('detailModalOverlay').classList.add('open');
}

function closeDetailSheet() {
  openSlug = null;
  document.getElementById('detailModalOverlay').classList.remove('open');
}

document.getElementById('detailToggleBtn').addEventListener('click', function() {
  toggleCaught(openSlug);
  renderDetailSheet();
});
document.getElementById('detailModalClose').addEventListener('click', closeDetailSheet);
document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetailSheet();
});

function renderLegend(game) {
  const row = document.getElementById('legendRow');
  const badges = game.versionBadges;
  if (!badges || Object.keys(badges).length === 0) {
    row.style.display = 'none';
    row.innerHTML = '';
    return;
  }
  row.innerHTML = Object.keys(badges).map(function(key) {
    const b = badges[key];
    return '<span><span class="dot" style="background:' + b.color + '"></span> ' + b.label + '</span>';
  }).join('');
  row.style.display = 'flex';
}

function render() {
  const game = currentGame();
  document.getElementById('gameTitle').textContent = game.label;
  const totalCount = totalUniqueSlugs(game).size;
  document.getElementById('gameSub').textContent = totalCount + ' Pokémon to track';
  renderLegend(game);

  const main = document.getElementById('main');
  main.innerHTML = '';
  game.sections.forEach(function(section) { main.appendChild(buildSection(game, section)); });
  updateProgress();
  applyFilters();
  renderGameMenu();
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(function(card) {
    const matchesText = !q || card.dataset.name.indexOf(q) !== -1;
    const caught = card.classList.contains('caught');
    let matchesMode = true;
    if (viewMode === 'caught') matchesMode = caught;
    if (viewMode === 'uncaught') matchesMode = !caught;
    card.classList.toggle('hidden', !(matchesText && matchesMode));
  });
}

// ---------- Game switcher ----------
function renderGameMenu() {
  const menu = document.getElementById('gameMenu');
  menu.innerHTML = '';
  Object.keys(GAMES).forEach(function(gid) {
    const btn = document.createElement('button');
    btn.textContent = GAMES[gid].shortLabel || GAMES[gid].label;
    if (gid === currentGameId()) btn.className = 'active';
    btn.addEventListener('click', function() {
      store.currentGame = gid;
      saveStore(store);
      menu.classList.remove('open');
      render();
    });
    menu.appendChild(btn);
  });
}

document.getElementById('gameSwitchBtn').addEventListener('click', function() {
  document.getElementById('gameMenu').classList.toggle('open');
});

// ---------- History ----------
function formatHistoryGroupLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const startOfDay = function(dt) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime(); };
  const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  if (diffDays > 1 && diffDays < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function renderHistory() {
  const game = currentGame();
  const map = currentCaughtMap();
  const list = document.getElementById('historyList');
  list.innerHTML = '';

  const entries = Object.keys(map)
    .filter(function(slug) { return game.species[slug]; })
    .map(function(slug) { return { slug: slug, ts: map[slug] }; });

  if (entries.length === 0) {
    list.innerHTML = '<div class="history-empty">No catches logged yet for ' + game.label + '.</div>';
    return;
  }

  const timed = entries.filter(function(e) { return typeof e.ts === 'number'; })
    .sort(function(a, b) { return b.ts - a.ts; });
  const undated = entries.filter(function(e) { return typeof e.ts !== 'number'; })
    .sort(function(a, b) { return a.slug.localeCompare(b.slug); });

  let lastLabel = null;
  timed.forEach(function(entry) {
    const label = formatHistoryGroupLabel(entry.ts);
    if (label !== lastLabel) {
      const groupEl = document.createElement('div');
      groupEl.className = 'history-group-label';
      groupEl.textContent = label;
      list.appendChild(groupEl);
      lastLabel = label;
    }
    list.appendChild(buildHistoryRow(entry.slug, game, entry.ts));
  });

  if (undated.length > 0) {
    const groupEl = document.createElement('div');
    groupEl.className = 'history-group-label';
    groupEl.textContent = 'Date unknown';
    list.appendChild(groupEl);
    undated.forEach(function(entry) {
      list.appendChild(buildHistoryRow(entry.slug, game, null));
    });
  }
}

function buildHistoryRow(slug, game, ts) {
  const sp = game.species[slug];
  const row = document.createElement('div');
  row.className = 'history-row';
  const timeStr = ts ? new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
  row.innerHTML =
    '<img src="' + sp.i + '" alt="' + sp.n + '" onerror="this.style.visibility=\'hidden\'">' +
    '<span class="history-name">' + sp.n + '</span>' +
    '<span class="history-time">' + timeStr + '</span>';
  row.addEventListener('click', function() {
    closeHistoryModal();
    openDetailSheet(slug);
  });
  return row;
}

function openHistoryModal() {
  renderHistory();
  document.getElementById('historyModalOverlay').classList.add('open');
}
function closeHistoryModal() {
  document.getElementById('historyModalOverlay').classList.remove('open');
}

document.getElementById('historyBtn').addEventListener('click', openHistoryModal);
document.getElementById('historyModalClose').addEventListener('click', closeHistoryModal);
document.getElementById('historyModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeHistoryModal();
});

document.getElementById('searchBox').addEventListener('input', function() {
  document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
  applyFilters();
});
document.getElementById('searchClear').addEventListener('click', function() {
  const box = document.getElementById('searchBox');
  box.value = '';
  box.focus();
  this.classList.remove('visible');
  applyFilters();
});

document.getElementById('viewToggleBtn').addEventListener('click', function() {
  const idx = VIEW_MODES.indexOf(viewMode);
  viewMode = VIEW_MODES[(idx + 1) % VIEW_MODES.length];
  this.textContent = VIEW_LABELS[viewMode];
  applyFilters();
});

document.getElementById('resetBtn').addEventListener('click', function() {
  const game = currentGame();
  if (confirm('Reset all catch progress for ' + game.label + '? This cannot be undone.')) {
    store.games[currentGameId()] = { caught: {} };
    saveStore(store);
    render();
  }
});

document.getElementById('exportBtn').addEventListener('click', function() {
  const payload = {
    exportedFrom: 'pokedex-tracker',
    exportedAt: new Date().toISOString(),
    schemaVersion: store.schemaVersion || 2,
    currentGame: store.currentGame,
    games: store.games
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'pokedex-tracker-backup-' + dateStr + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', function() {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (err) {
      alert('That file is not valid JSON.');
      e.target.value = '';
      return;
    }
    if (!data || typeof data !== 'object' || typeof data.games !== 'object') {
      alert('That file does not look like a Pokedex Tracker backup.');
      e.target.value = '';
      return;
    }
    const gameNames = Object.keys(data.games).map(function(gid) {
      return (GAMES[gid] && GAMES[gid].label) || gid;
    }).join(', ') || '(none)';
    if (!confirm('Import backup and replace current progress for: ' + gameNames + '? This cannot be undone.')) {
      e.target.value = '';
      return;
    }
    store.games = data.games;
    if (data.currentGame && GAMES[data.currentGame]) {
      store.currentGame = data.currentGame;
    }
    saveStore(store);
    render();
    e.target.value = '';
  };
  reader.onerror = function() {
    alert('Could not read that file.');
    e.target.value = '';
  };
  reader.readAsText(file);
});

render();
</script>
