<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword & Shield Pokedex Tracker</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-dim: #6b7280;
    --accent: #d64545;
    --accent-2: #3a7bd5;
    --caught-bg: #e6f7ec;
    --caught-border: #34a853;
    --border: #e2e4e8;
    --header-bg: #d64545;
    --header-text: #ffffff;
    --chip-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card-bg: #23262c;
      --text: #f0f1f3;
      --text-dim: #9aa0a8;
      --accent: #ff6b6b;
      --accent-2: #5b9bff;
      --caught-bg: #123421;
      --caught-border: #34a853;
      --border: #33363d;
      --header-bg: #7a1f1f;
      --header-text: #ffffff;
      --chip-bg: #2c2f36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 1.25rem;
  }
  header .sub {
    font-size: 0.8rem;
    opacity: 0.9;
  }
  .progress-wrap {
    margin-top: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #ffffff;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.75rem;
    margin-top: 4px;
    text-align: right;
    opacity: 0.9;
  }
  .controls {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
    position: sticky;
    top: 78px;
    z-index: 9;
    flex-wrap: wrap;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 140px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  .controls select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.85rem;
  }
  .controls button.toggle-all {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.8rem;
  }
  main {
    padding: 0 12px;
  }
  .section {
    margin-top: 18px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 6px;
    cursor: pointer;
    user-select: none;
  }
  .section-header h2 {
    font-size: 1.05rem;
    margin: 0;
  }
  .section-header .count {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .section-header .chevron {
    transition: transform 0.2s ease;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-left: 8px;
  }
  .section.collapsed .chevron {
    transform: rotate(-90deg);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
    padding-bottom: 4px;
  }
  .section.collapsed .grid {
    display: none;
  }
  .card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 6px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }
  .card.caught {
    background: var(--caught-bg);
    border-color: var(--caught-border);
  }
  .card.hidden { display: none; }
  .card img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.55;
  }
  .card.caught img {
    filter: none;
    opacity: 1;
  }
  .card .name {
    font-size: 0.68rem;
    margin-top: 2px;
    line-height: 1.1;
    word-break: break-word;
  }
  .card .num {
    font-size: 0.6rem;
    color: var(--text-dim);
    position: absolute;
    top: 3px;
    left: 5px;
  }
  .card .check {
    position: absolute;
    top: 3px;
    right: 5px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--text-dim);
    background: transparent;
  }
  .card.caught .check {
    background: var(--caught-border);
    border-color: var(--caught-border);
  }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
    padding: 20px 16px 8px;
  }

  .badge {
    position: absolute;
    bottom: 3px;
    left: 3px;
    font-size: 0.55rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 4px;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .badge.sword { background: #4a6fa5; }
  .badge.shield { background: #a54a4a; }
  .badge.split { background: #8a6dbb; }
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 0.7rem;
    color: var(--text-dim);
    padding: 0 16px 8px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .legend .dot {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    display: inline-block;
  }
  .legend .dot.sword { background: #4a6fa5; }
  .legend .dot.shield { background: #a54a4a; }
  .legend .dot.split { background: #8a6dbb; }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.75rem;
    margin-top: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Pokemon Sword &amp; Shield</h1>
  <div class="sub">Galar Dex catch tracker</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">0 / 0 caught</div>
</header>

<div class="legend">
  <span><span class="dot sword"></span> Sword exclusive</span>
  <span><span class="dot shield"></span> Shield exclusive</span>
  <span><span class="dot split"></span> Form varies by version</span>
</div>

<div class="controls">
  <input type="search" id="searchBox" placeholder="Search Pokemon...">
  <select id="filterSelect">
    <option value="all">All</option>
    <option value="caught">Caught</option>
    <option value="uncaught">Not caught</option>
    <option value="sword">Sword exclusive</option>
    <option value="shield">Shield exclusive</option>
  </select>
</div>

<main id="main"></main>

<footer>
  Data &amp; sprites from <a href="https://pokemondb.net/pokedex/game/sword-shield" target="_blank" rel="noopener">pokemondb.net</a>. Progress is saved on this device only.
  <br>
  <button class="reset-btn" id="resetBtn">Reset all progress</button>
</footer>

const GAME_KEY = "pokedex-sword-shield-v1"; // per-game storage key; other games use their own key so catches never sync between them.

let state = {};
try {
  state = JSON.parse(localStorage.getItem(GAME_KEY) || "{}");
} catch (e) { state = {}; }

function saveState() {
  try {
    localStorage.setItem(GAME_KEY, JSON.stringify(state));
  } catch (e) { /* storage unavailable, ignore */ }
}

function isCaught(slug) {
  return !!state[slug];
}

function toggleCaught(slug) {
  state[slug] = !state[slug];
  if (!state[slug]) delete state[slug];
  saveState();
  updateCardEls(slug);
  updateProgress();
}

function updateCardEls(slug) {
  document.querySelectorAll('.card[data-slug="' + slug + '"]').forEach(function(el) {
    el.classList.toggle('caught', isCaught(slug));
  });
}

function totalUniqueSlugs() {
  const all = new Set();
  DATA.sections.forEach(function(s) {
    s.slugs.forEach(function(slug) { all.add(slug); });
  });
  return all;
}

function updateProgress() {
  const all = totalUniqueSlugs();
  let caught = 0;
  all.forEach(function(slug) { if (isCaught(slug)) caught++; });
  const total = all.size;
  const pct = total ? Math.round((caught / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = caught + ' / ' + total + ' caught (' + pct + '%)';

  DATA.sections.forEach(function(s) {
    let c = 0;
    s.slugs.forEach(function(slug) { if (isCaught(slug)) c++; });
    const el = document.getElementById('count-' + s.id);
    if (el) el.textContent = c + ' / ' + s.slugs.length;
  });
}

function buildSection(section) {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.id = 'section-' + section.id;

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML =
    '<h2>' + section.label + '</h2>' +
    '<div style="display:flex;align-items:center;">' +
      '<span class="count" id="count-' + section.id + '">0 / ' + section.slugs.length + '</span>' +
      '<span class="chevron">&#9662;</span>' +
    '</div>';
  header.addEventListener('click', function() {
    wrap.classList.toggle('collapsed');
  });
  wrap.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'grid';

  section.slugs.forEach(function(slug, idx) {
    const sp = DATA.species[slug];
    if (!sp) return;
    const card = document.createElement('div');
    card.className = 'card' + (isCaught(slug) ? ' caught' : '');
    card.dataset.slug = slug;
    card.dataset.name = sp.n.toLowerCase();
    card.dataset.version = sp.v || '';
    var badgeHtml = '';
    if (sp.v === 'sword') badgeHtml = '<span class="badge sword">SW</span>';
    else if (sp.v === 'shield') badgeHtml = '<span class="badge shield">SH</span>';
    else if (sp.v === 'split') badgeHtml = '<span class="badge split">SW/SH</span>';
    card.innerHTML =
      '<span class="num">#' + String(idx + 1).padStart(3, '0') + '</span>' +
      '<span class="check"></span>' +
      '<img src="' + sp.i + '" alt="' + sp.n + '" loading="lazy">' +
      '<div class="name">' + sp.n + '</div>' +
      badgeHtml;
    card.addEventListener('click', function() { toggleCaught(slug); });
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  DATA.sections.forEach(function(section) {
    main.appendChild(buildSection(section));
  });
  updateProgress();
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const mode = document.getElementById('filterSelect').value;
  document.querySelectorAll('.card').forEach(function(card) {
    const matchesText = !q || card.dataset.name.indexOf(q) !== -1;
    const caught = card.classList.contains('caught');
    let matchesMode = true;
    if (mode === 'caught') matchesMode = caught;
    if (mode === 'uncaught') matchesMode = !caught;
    if (mode === 'sword') matchesMode = card.dataset.version === 'sword';
    if (mode === 'shield') matchesMode = card.dataset.version === 'shield';
    card.classList.toggle('hidden', !(matchesText && matchesMode));
  });
}

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.getElementById('filterSelect').addEventListener('change', applyFilters);
document.getElementById('resetBtn').addEventListener('click', function() {
  if (confirm('Reset all catch progress for Sword & Shield? This cannot be undone.')) {
    state = {};
    saveState();
    render();
    applyFilters();
  }
});

render();

// re-apply filters after any toggle since caught/uncaught filter depends on state
const origToggle = toggleCaught;
toggleCaught = function(slug) {
  origToggle(slug);
  applyFilters();
};
</script>
